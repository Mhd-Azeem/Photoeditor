name: Build Release APK

on:
  push:
    branches: [ "claude/cool-mccarthy-okxdtg", "main" ]
  workflow_dispatch:

concurrency:
  group: photoeditor-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android SDK
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Cache fallback signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photoeditor-debug-keystore-v1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare permanent signing key
        env:
          PHOTOEDITOR_KEYSTORE_BASE64: ${{ secrets.PHOTOEDITOR_KEYSTORE_BASE64 }}
          PHOTOEDITOR_KEYSTORE_PASSWORD: ${{ secrets.PHOTOEDITOR_KEYSTORE_PASSWORD }}
          PHOTOEDITOR_KEY_ALIAS: ${{ secrets.PHOTOEDITOR_KEY_ALIAS }}
          PHOTOEDITOR_KEY_PASSWORD: ${{ secrets.PHOTOEDITOR_KEY_PASSWORD }}
        run: |
          if [ -n "$PHOTOEDITOR_KEYSTORE_BASE64" ]; then
            echo "$PHOTOEDITOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/photoeditor-release.jks"
            echo "PHOTOEDITOR_KEYSTORE_PATH=$RUNNER_TEMP/photoeditor-release.jks" >> "$GITHUB_ENV"
            echo "PHOTOEDITOR_KEYSTORE_PASSWORD=$PHOTOEDITOR_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PHOTOEDITOR_KEY_ALIAS=$PHOTOEDITOR_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PHOTOEDITOR_KEY_PASSWORD=$PHOTOEDITOR_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/Azeems-Editor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azeems-Editor-release
          path: release-apks/Azeems-Editor.apk
          retention-days: 30
          compression-level: 0

      - name: Remove old latest APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset latest Azeems-Editor.apk --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Azeem's Editor Latest
          body: |
            Build number: ${{ github.run_number }}
            Automatically rebuilt from commit ${{ github.sha }}.

            The app checks this release automatically and offers `Azeems-Editor.apk` when a newer build is available.
          prerelease: false
          make_latest: true
          files: release-apks/Azeems-Editor.apk
