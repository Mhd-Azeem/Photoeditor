name: Build Release APK

on:
  push:
    branches: [ "claude/cool-mccarthy-okxdtg", "main" ]
  workflow_dispatch:

concurrency:
  group: photoeditor-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Cache fallback signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photoeditor-debug-keystore-v1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare permanent signing key
        env:
          PHOTOEDITOR_KEYSTORE_BASE64: ${{ secrets.PHOTOEDITOR_KEYSTORE_BASE64 }}
          PHOTOEDITOR_KEYSTORE_PASSWORD: ${{ secrets.PHOTOEDITOR_KEYSTORE_PASSWORD }}
          PHOTOEDITOR_KEY_ALIAS: ${{ secrets.PHOTOEDITOR_KEY_ALIAS }}
          PHOTOEDITOR_KEY_PASSWORD: ${{ secrets.PHOTOEDITOR_KEY_PASSWORD }}
        run: |
          if [ -n "$PHOTOEDITOR_KEYSTORE_BASE64" ]; then
            echo "$PHOTOEDITOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/photoeditor-release.jks"
            echo "PHOTOEDITOR_KEYSTORE_PATH=$RUNNER_TEMP/photoeditor-release.jks" >> "$GITHUB_ENV"
            echo "PHOTOEDITOR_KEYSTORE_PASSWORD=$PHOTOEDITOR_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PHOTOEDITOR_KEY_ALIAS=$PHOTOEDITOR_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PHOTOEDITOR_KEY_PASSWORD=$PHOTOEDITOR_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Install native build tools
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Prepare pinned NCNN and bundled photo model
        run: bash scripts/prepare-ai.sh

      - name: Prepare fallback signing identity when previous key is unavailable
        run: |
          if [ -z "${PHOTOEDITOR_KEYSTORE_PATH:-}" ] && [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=AZ Photo Editor, O=AZ, C=LK" -keyalg RSA -keysize 2048 -validity 10000
            echo "Previous signing key was unavailable; a new CI fallback identity is used." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release and inference tests
        run: ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Prepare and verify APK contents
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/AZ-Photo-Editor-v2.0.apk
          python3 scripts/verify-apk.py release-apks/AZ-Photo-Editor-v2.0.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release-apks/AZ-Photo-Editor-v2.0.apk | tee release-apks/signing.txt
          "$BUILD_TOOLS/aapt" dump badging release-apks/AZ-Photo-Editor-v2.0.apk | head -1 | tee release-apks/package.txt
          grep -q "name='com.photoeditor'" release-apks/package.txt
          grep -q "versionName='2.0'" release-apks/package.txt

      - name: Compare previous signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-apk
          gh release download latest --pattern Azeems-Editor.apk --dir prior-apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs prior-apk/Azeems-Editor.apk > prior-apk/signing.txt
          if diff <(grep 'certificate SHA-256 digest' prior-apk/signing.txt) <(grep 'certificate SHA-256 digest' release-apks/signing.txt); then
            echo "Signing identity matches the previous APK." > release-apks/signing-continuity.txt
          else
            echo "The previous signing key was unavailable. This APK uses a new certificate; uninstall the previous app before installing v2.0." > release-apks/signing-continuity.txt
          fi
          cat release-apks/signing-continuity.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test actual bundled model inference on Android CPU
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.photoeditor.test/androidx.test.runner.AndroidJUnitRunner | tee release-apks/instrumentation.txt
            grep -q 'OK (1 test)' release-apks/instrumentation.txt

      - name: Upload verified build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AZ-Photo-Editor-v2.0
          path: |
            release-apks/
            app/build/reports/
          retention-days: 30
          compression-level: 0

      - name: Publish separate v2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat RELEASE-v2.0.md release-apks/signing-continuity.txt > release-apks/release-notes.md
          gh release create v2.0 release-apks/AZ-Photo-Editor-v2.0.apk release-apks/verification.json release-apks/signing.txt release-apks/instrumentation.txt \
            --title "AZ Photo Editor v2.0 — Offline 4K AI" \
            --notes-file release-apks/release-notes.md --target "${{ github.sha }}" --latest
